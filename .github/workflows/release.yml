name: Release

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runner
          push: true
          tags: |
            leandrokanis/open-class-api:latest
            leandrokanis/open-class-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push UI
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ui/Dockerfile
          target: runner
          push: true
          tags: |
            leandrokanis/open-class-ui:latest
            leandrokanis/open-class-ui:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.picgama.online
            NEXT_PUBLIC_GOOGLE_OAUTH=${{ secrets.GOOGLE_CLIENT_ID != '' && 'true' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
