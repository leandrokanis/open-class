services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openclass
      POSTGRES_USER: openclass
      POSTGRES_PASSWORD: openclass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openclass"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
