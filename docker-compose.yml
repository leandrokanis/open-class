services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openclass
      POSTGRES_USER: openclass
      POSTGRES_PASSWORD: openclass
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openclass"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    image: open-class-api:local
    environment:
      DATABASE_URL: postgresql://openclass:openclass@db:5432/openclass
    command: ["node", "packages/db/dist/src/migrate.js"]
    depends_on:
      db:
        condition: service_healthy
    # No restart policy: migrator must run once and exit cleanly.
    # Restart-on-failure here would mask bugs in an infinite loop and the api
    # service would wait forever on service_completed_successfully.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    image: open-class-api:local
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://openclass:openclass@db:5432/openclass
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-100y}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3001/auth/google/callback}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      APP_URL: ${APP_URL:-http://localhost:3001}
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
      target: runner
    ports:
      - "${UI_PORT:-3003}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
